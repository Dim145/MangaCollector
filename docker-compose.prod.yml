networks:
  ip6net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default

services:
  server:
    build: ./server
    # 門 · Loopback only. The reverse proxy in front is the way in; a
    # port published on every interface bypasses it — and host firewalls
    # like UFW, whose rules Docker's own chains skip. Reached directly,
    # `X-Forwarded-For` is whatever the caller writes, so with
    # TRUST_PROXY_HEADERS=true the rate limiter would key on a value the
    # caller chooses. A proxy on the host reaches 127.0.0.1; a proxy in
    # another container should join this network and use `server:3000`.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./server/.env
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - ip6net

  client:
    build: ./client
    # nginx listens on :80 inside the container (see client/nginx.conf).
    # This was `5173:5173` — the container port nothing binds — so the
    # published port answered nothing at all.
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
    # FRONTEND_* env vars are read by docker-entrypoint.sh and templated
    # into index.html + nginx.conf at startup. Set them at the host
    # level (or via an env_file) and they pass through automatically.
    environment:
      - FRONTEND_UMAMI_SCRIPT_URL=${FRONTEND_UMAMI_SCRIPT_URL:-}
      - FRONTEND_UMAMI_WEBSITE_ID=${FRONTEND_UMAMI_WEBSITE_ID:-}
      - FRONTEND_UMAMI_ORIGIN=${FRONTEND_UMAMI_ORIGIN:-}
      - FRONTEND_SENTRY_DSN=${FRONTEND_SENTRY_DSN:-}
      - FRONTEND_BUGSINK_DSN=${FRONTEND_BUGSINK_DSN:-}
