# 護 · Security headers.
#
# `connect-src` lists what the BROWSER contacts, which is not the same
# set as the server's integrations: MangaDex and AniList are called
# server-side only, while `data:` and the cover/font hosts are needed
# because html-to-image re-fetches every image and webfont it inlines
# when the Year-in-Review poster is exported. Removing an entry here
# breaks a feature silently — check the code, not the integration list.
#
# nginx does NOT merge `add_header` across levels: a `location` block
# that sets even one header discards every header inherited from the
# server block. Every location here sets a `Cache-Control`, so headers
# declared at the server level reached nothing but a handful of static
# files at the root. They live in this file instead, and every location
# includes it — miss the include on a new location and that location
# silently ships without a policy, so add it with the block.
#
# `${FRONTEND_INLINE_SCRIPT_HASHES}` is computed at container start from
# the templated index.html (docker-entrypoint.sh); it falls back to
# 'unsafe-inline' if the extraction finds nothing, so a page that boots
# is never traded for a policy.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' ${FRONTEND_INLINE_SCRIPT_HASHES} ${FRONTEND_UMAMI_ORIGIN}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://cdn.myanimelist.net https://uploads.mangadex.org https://mangadex.org https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com https://s4.anilist.co https://books.google.com https://*.googleusercontent.com https://covers.openlibrary.org https://cover.openbd.jp; connect-src 'self' data: https://api.jikan.moe https://www.googleapis.com https://openlibrary.org https://api.openbd.jp https://cdn.myanimelist.net https://uploads.mangadex.org https://fonts.googleapis.com https://fonts.gstatic.com ${FRONTEND_UMAMI_ORIGIN} ${FRONTEND_OBSERVABILITY_ORIGIN}; font-src 'self' data: https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
